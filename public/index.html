<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conversión de Ventas — Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-1-soft: #cde2fb;
    --good: #0ca30c;
    --warning: #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-1-soft: #184f95;
      --good: #0ca30c;
      --warning: #fab219;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-1-soft: #184f95;
    --good: #0ca30c;
    --warning: #fab219;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .updated {
    font-size: 12px;
    color: var(--text-muted);
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  .btn {
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--text-muted); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  /* ---- Stat tiles ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tile .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .tile .value {
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
  }
  .tile .caption {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ---- Chart section ---- */
  section { margin-bottom: 24px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }
  .bar-row .agente-name {
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    position: relative;
    height: 22px;
    background: var(--gridline);
    border-radius: 4px;
    overflow: visible;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--series-1);
    border-radius: 4px;
    min-width: 4px;
    transition: width 0.4s ease;
  }
  .goal-line {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--text-primary);
    opacity: 0.45;
  }
  .goal-line::after {
    content: "meta";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .bar-row .amount {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 78px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  .goal-badge {
    color: var(--good);
    font-size: 13px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--series-1); }
  .swatch.line { width: 2px; height: 12px; border-radius: 0; background: var(--text-primary); opacity: 0.45; }

  /* ---- Table ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  tr:last-child td { border-bottom: none; }

  /* ---- States ---- */
  .state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
  }
  .state .big { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
  .state .small { font-size: 13px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ---- Login ---- */
  .login {
    max-width: 380px;
    margin: 80px auto;
  }
  .login h2 { font-size: 17px; margin: 0 0 6px; }
  .login p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 4px; }
  .login input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    margin-top: 10px;
  }
  .login .error {
    color: #d03b3b;
    font-size: 12px;
    min-height: 16px;
    margin-top: 8px;
  }
  .login .btn { width: 100%; justify-content: center; margin-top: 4px; }
  .whoami { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <!-- content is rendered by JS -->
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://lomxwrjtnyccophpjbjk.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvbXh3cmp0bnljY29waHBqYmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMjY5NzMsImV4cCI6MjA5OTcwMjk3M30.CVSo51OrBwLGiF0FfmGt4gouxPajlWarjp4_6hdtVLU";
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var REFRESH_MS = 60000;
  var app = document.getElementById("app");
  var refreshTimer = null;

  var currency = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  var currencyPrecise = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 });

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function renderLogin(errorMsg) {
    app.innerHTML = "";
    var panel = el("div", { class: "card login" }, [
      el("h2", { text: "Conversión de Ventas" }),
      el("p", { text: "Ingresá con el email y la contraseña que te dieron." }),
    ]);
    var emailInput = el("input", { type: "email", placeholder: "tu@email.com" });
    var passInput = el("input", { type: "password", placeholder: "Contraseña" });
    var error = el("div", { class: "error", text: errorMsg || "" });
    var loginBtn = el("button", { class: "btn", text: "Entrar" });
    loginBtn.addEventListener("click", function () {
      var email = emailInput.value.trim();
      var password = passInput.value;
      if (!email || !password) {
        error.textContent = "Completá email y contraseña.";
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent = "Entrando…";
      supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function (result) {
        if (result.error) {
          error.textContent = "Email o contraseña incorrectos.";
          loginBtn.disabled = false;
          loginBtn.textContent = "Entrar";
          return;
        }
        boot();
      });
    });
    passInput.addEventListener("keydown", function (e) { if (e.key === "Enter") loginBtn.click(); });
    panel.appendChild(emailInput);
    panel.appendChild(passInput);
    panel.appendChild(error);
    panel.appendChild(loginBtn);
    app.appendChild(panel);
    emailInput.focus();
  }

  function renderShell(email) {
    app.innerHTML = "";

    var header = el("header", {}, [
      el("div", {}, [
        el("h1", { text: "Conversión de Ventas" }),
        el("p", { class: "subtitle", text: "Leads → Registro EXOPTION → FTD → Venta de membresía, por agente" }),
      ]),
      el("div", { class: "toolbar" }, [
        el("span", { class: "whoami", text: email || "" }),
        el("span", { class: "updated", id: "updated-label", text: "" }),
        el("button", { class: "btn", id: "refresh-btn", text: "Actualizar" }),
        el("button", { class: "btn", id: "logout-btn", text: "Salir" }),
      ]),
    ]);
    app.appendChild(header);

    var content = el("div", { id: "content" });
    app.appendChild(content);

    app.appendChild(el("footer", {}, [
      el("span", { text: "Se actualiza solo cada minuto." }),
    ]));

    document.getElementById("refresh-btn").addEventListener("click", function () {
      loadMetrics(true);
    });
    document.getElementById("logout-btn").addEventListener("click", function () {
      supabaseClient.auth.signOut().then(boot);
    });
  }

  function renderContentState(node) {
    var content = document.getElementById("content");
    content.innerHTML = "";
    content.appendChild(node);
  }

  function renderLoading() {
    renderContentState(el("div", { class: "card state" }, [
      el("div", { class: "big", text: "Cargando datos…" }),
    ]));
  }

  function renderError(message) {
    renderContentState(el("div", { class: "card state" }, [
      el("div", { class: "big", text: "No se pudo cargar el panel" }),
      el("div", { class: "small", text: message }),
    ]));
  }

  function pct(n) {
    return (Math.round(n * 10) / 10).toString().replace(".0", "") + "%";
  }

  function renderData(data) {
    var meta = Number(data.metaVentasUSD) || 2400;
    var agentes = (data.agentes || []).slice().sort(function (a, b) { return b.ventasUSD - a.ventasUSD; });

    var totals = agentes.reduce(function (acc, a) {
      acc.leads += a.leads || 0;
      acc.registros += a.registros || 0;
      acc.ftds += a.ftds || 0;
      acc.ventasUSD += a.ventasUSD || 0;
      return acc;
    }, { leads: 0, registros: 0, ftds: 0, ventasUSD: 0 });

    var content = el("div");

    var tiles = el("div", { class: "tiles" }, [
      statTile("Leads", totals.leads.toLocaleString("en-US"), null),
      statTile("Registrados en EXOPTION", totals.registros.toLocaleString("en-US"), totals.leads ? pct(totals.registros / totals.leads * 100) + " de los leads" : null),
      statTile("FTDs", totals.ftds.toLocaleString("en-US"), totals.leads ? pct(totals.ftds / totals.leads * 100) + " de los leads" : null),
      statTile("Ventas de membresía", currency.format(totals.ventasUSD), agentes.length ? "Meta del equipo: " + currency.format(meta * agentes.length) : null),
    ]);
    content.appendChild(tiles);

    if (agentes.length === 0) {
      content.appendChild(el("div", { class: "card state" }, [
        el("div", { class: "big", text: "Todavía no hay ventas registradas" }),
        el("div", { class: "small", text: "El resumen de arriba va a llenarse a medida que entren eventos." }),
      ]));
      renderContentState(content);
      return;
    }

    var maxScale = Math.max(meta, agentes[0].ventasUSD || 0) * 1.15;
    var chartCard = el("div", { class: "card" });
    chartCard.appendChild(el("div", { class: "section-title", text: "Ventas por agente" }));
    chartCard.appendChild(el("div", { class: "section-desc", text: "Meta individual: " + currency.format(meta) }));
    agentes.forEach(function (a) {
      var widthPct = Math.max(0, Math.min(100, (a.ventasUSD / maxScale) * 100));
      var goalPct = Math.max(0, Math.min(100, (meta / maxScale) * 100));
      var track = el("div", { class: "bar-track" }, [
        el("div", { class: "bar-fill", style: "width:" + widthPct + "%" }),
        el("div", { class: "goal-line", style: "left:" + goalPct + "%" }),
      ]);
      var metGoal = a.ventasUSD >= meta;
      var row = el("div", { class: "bar-row" }, [
        el("div", { class: "agente-name", text: a.agente, title: a.agente }),
        track,
        el("div", { class: "amount" }, [
          metGoal ? el("span", { class: "goal-badge", title: "Meta alcanzada", text: "✓" }) : null,
          el("span", { text: currency.format(a.ventasUSD) }),
        ]),
      ]);
      chartCard.appendChild(row);
    });
    chartCard.appendChild(el("div", { class: "legend-row" }, [
      el("div", { class: "legend-item" }, [el("div", { class: "swatch" }), el("span", { text: "Ventas (USD)" })]),
      el("div", { class: "legend-item" }, [el("div", { class: "swatch line" }), el("span", { text: "Meta ($" + meta.toLocaleString("en-US") + ")" })]),
    ]));
    content.appendChild(el("section", {}, [chartCard]));

    var tableCard = el("div", { class: "card table-scroll" });
    var table = el("table");
    table.appendChild(el("thead", {}, [
      el("tr", {}, [
        el("th", { text: "Agente" }),
        el("th", { class: "num", text: "Leads" }),
        el("th", { class: "num", text: "Registros" }),
        el("th", { class: "num", text: "FTDs" }),
        el("th", { class: "num", text: "Ventas (USD)" }),
        el("th", { class: "num", text: "% de meta" }),
        el("th", { class: "num", text: "Lead→Registro" }),
        el("th", { class: "num", text: "Registro→FTD" }),
        el("th", { class: "num", text: "Lead→FTD" }),
      ]),
    ]));
    var tbody = el("tbody");
    agentes.forEach(function (a) {
      var c = a.conversion || {};
      tbody.appendChild(el("tr", {}, [
        el("td", { text: a.agente }),
        el("td", { class: "num", text: (a.leads || 0).toLocaleString("en-US") }),
        el("td", { class: "num", text: (a.registros || 0).toLocaleString("en-US") }),
        el("td", { class: "num", text: (a.ftds || 0).toLocaleString("en-US") }),
        el("td", { class: "num", text: currencyPrecise.format(a.ventasUSD || 0) }),
        el("td", { class: "num", text: pct((a.ventasUSD || 0) / meta * 100) }),
        el("td", { class: "num", text: pct(c.leadToRegistro || 0) }),
        el("td", { class: "num", text: pct(c.registroToFtd || 0) }),
        el("td", { class: "num", text: pct(c.leadToFtd || 0) }),
      ]));
    });
    table.appendChild(tbody);
    tableCard.appendChild(el("div", { class: "section-title", text: "Detalle por agente" }));
    tableCard.appendChild(table);
    content.appendChild(el("section", {}, [tableCard]));

    renderContentState(content);

    document.getElementById("updated-label").textContent =
      "Actualizado " + new Date(data.actualizado || Date.now()).toLocaleTimeString("es-419", { hour: "2-digit", minute: "2-digit" });
  }

  function statTile(label, value, caption) {
    var children = [
      el("div", { class: "label", text: label }),
      el("div", { class: "value", text: value }),
    ];
    if (caption) children.push(el("div", { class: "caption", text: caption }));
    return el("div", { class: "card tile" }, children);
  }

  function loadMetrics(manual, accessToken) {
    var refreshBtn = document.getElementById("refresh-btn");
    if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = "Actualizando…"; }
    if (manual) renderLoading();

    fetch("/metrics", { headers: { Authorization: "Bearer " + accessToken } })
      .then(function (res) {
        if (res.status === 401) throw new Error("Tu sesión venció, volvé a iniciar sesión.");
        if (res.status === 403) throw new Error("Tu cuenta todavía no tiene acceso configurado. Pedile al director que te habilite.");
        if (!res.ok) throw new Error("El servidor respondió con un error (código " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        renderData(data);
      })
      .catch(function (err) {
        renderError(err.message || "No se pudo obtener /metrics.");
      })
      .finally(function () {
        if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = "Actualizar"; }
      });
  }

  function boot() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    supabaseClient.auth.getSession().then(function (result) {
      var session = result.data && result.data.session;
      if (!session) {
        renderLogin();
        return;
      }
      renderShell(session.user && session.user.email);
      renderLoading();
      loadMetrics(false, session.access_token);
      refreshTimer = setInterval(function () {
        supabaseClient.auth.getSession().then(function (r) {
          var s = r.data && r.data.session;
          if (s) loadMetrics(false, s.access_token);
        });
      }, REFRESH_MS);
    });
  }

  boot();
})();
</script>
</body>
</html>
