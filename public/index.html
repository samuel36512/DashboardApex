<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conversión de Ventas — Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1: #171510;
    --page: #0a0908;
    --text-primary: #f6f1e6;
    --text-secondary: #beb49b;
    --text-muted: #837a63;
    --gridline: #2a271e;
    --baseline: #3a3527;
    --border: rgba(224,187,102,0.16);
    --series-1: #dcae53;
    --series-1-soft: #3d3115;
    --good: #4caf6d;
    --warning: #e0a83c;
    --danger: #e5484d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .brand-mark {
    width: 9px;
    height: 9px;
    flex: none;
    background: var(--series-1);
    transform: rotate(45deg);
    border-radius: 2px;
  }
  .brand-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .brand-name b {
    color: var(--series-1);
    font-weight: 700;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .updated {
    font-size: 12px;
    color: var(--text-muted);
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  .btn {
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--series-1); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  /* ---- Stat tiles ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tile .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .tile .value {
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
  }
  .tile .caption {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ---- Chart section ---- */
  section { margin-bottom: 24px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }
  .bar-row .agente-name {
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    position: relative;
    height: 22px;
    background: var(--gridline);
    border-radius: 4px;
    overflow: visible;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--series-1);
    border-radius: 4px;
    min-width: 4px;
    transition: width 0.4s ease;
  }
  .goal-line {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--text-primary);
    opacity: 0.45;
  }
  .goal-line::after {
    content: "meta";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .bar-row .amount {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 78px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  .goal-badge {
    color: var(--good);
    font-size: 13px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--series-1); }
  .swatch.line { width: 2px; height: 12px; border-radius: 0; background: var(--text-primary); opacity: 0.45; }

  /* ---- FTD ranking ---- */
  .rank-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rank-row.top .rank-num {
    background: var(--series-1);
    border-color: var(--series-1);
    color: #14110a;
  }
  .rank-row .agente-name { font-size: 13px; }
  .rank-row .rank-ftd {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .rank-row .rank-ftd small {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 4px;
  }

  /* ---- Ventas del equipo ---- */
  .team-sales-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }
  .team-sales-card {
    background: linear-gradient(160deg, var(--surface-1), var(--page));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .team-sales-card:hover {
    border-color: var(--series-1);
    transform: translateY(-2px);
  }
  .tsc-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--page);
    background: linear-gradient(135deg, var(--series-1), #f4d78a);
    margin-bottom: 12px;
  }
  .tsc-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 14px;
  }
  .tsc-stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 7px 0;
    border-top: 1px solid var(--gridline);
  }
  .tsc-stat:first-of-type { border-top: none; }
  .tsc-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tsc-value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .tsc-value.gold { color: var(--series-1); }

  /* ---- Pago de directores ---- */
  .director-hero {
    text-align: center;
    padding: 36px 28px;
    background: radial-gradient(circle at 50% 0%, var(--series-1-soft), var(--surface-1) 70%);
  }
  .dh-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .dh-total {
    font-size: 44px;
    font-weight: 800;
    color: var(--series-1);
    font-variant-numeric: tabular-nums;
    margin-bottom: 24px;
  }
  .dh-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 20px 0;
    border-top: 1px solid var(--gridline);
    border-bottom: 1px solid var(--gridline);
    margin-bottom: 24px;
  }
  .dh-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dh-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .dh-stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .dh-progress-wrap { max-width: 480px; margin: 0 auto; text-align: left; }
  .dh-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .dh-progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2, var(--gridline));
    overflow: hidden;
  }
  .dh-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--series-1);
    transition: width 0.3s;
  }
  .dh-progress-fill.full { background: var(--good); }
  .dh-progress-caption {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .spotlight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .spotlight-card {
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .spotlight-card.star {
    background: linear-gradient(160deg, var(--series-1-soft), var(--surface-1));
  }
  .spotlight-card.warning {
    background: linear-gradient(160deg, rgba(229,72,77,0.16), var(--surface-1));
    border-color: rgba(229,72,77,0.35);
  }
  .spotlight-kicker {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .spotlight-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spotlight-value {
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .spotlight-card.warning .spotlight-value { color: var(--danger); }

  /* ---- Hero stat (costo promedio por FTD) ---- */
  .hero-stat {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    padding: 32px 28px;
    text-align: center;
    border: 1px solid rgba(220,174,83,0.32);
    background:
      radial-gradient(circle at 50% 0%, rgba(220,174,83,0.22), transparent 55%),
      repeating-linear-gradient(0deg, rgba(220,174,83,0.045) 0px, rgba(220,174,83,0.045) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(220,174,83,0.045) 0px, rgba(220,174,83,0.045) 1px, transparent 1px, transparent 40px),
      linear-gradient(160deg, #171510, #0a0908 70%);
    box-shadow: 0 0 0 1px rgba(220,174,83,0.05), 0 30px 70px -30px rgba(0,0,0,0.7);
  }
  .hero-stat-kicker {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }
  .hero-stat-value {
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    background: linear-gradient(160deg, #f6ecce, var(--series-1) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 46px rgba(220,174,83,0.35);
  }
  .hero-stat-caption {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .hero-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .hero-stat-grid .hero-stat { padding: 26px 22px; }

  /* ---- Abonos: desglose ventas vs. abonos ---- */
  .split-bar {
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    display: flex;
    margin: 4px 0 10px;
    background: var(--gridline);
  }
  .split-bar .seg-ventas { background: var(--good); }
  .split-bar .seg-abonos { background: var(--series-1); }
  .split-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .split-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .split-legend .bd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .breakdown-card {
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    background: var(--surface-1);
  }
  .breakdown-card .bd-kicker {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .breakdown-card .bd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .breakdown-card.ventas .bd-dot { background: var(--good); }
  .breakdown-card.abonos .bd-dot { background: var(--series-1); }
  .breakdown-card .bd-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .breakdown-card .bd-caption { margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
  .abono-panel {
    border: 1px solid rgba(220,174,83,0.32);
    border-radius: 12px;
    padding: 18px 20px;
    background: rgba(220,174,83,0.04);
    margin-bottom: 20px;
  }
  .valor-actual { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .valor-actual b { color: var(--series-1); font-variant-numeric: tabular-nums; }
  .abonos-toggle-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .hidden { display: none; }

  /* ---- Costo por FTD ---- */
  .cost-row {
    display: grid;
    grid-template-columns: 30px 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .cost-row:last-child { border-bottom: none; }
  .cost-rank {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gridline);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .cost-row.best .cost-rank { background: var(--good); color: #0a0908; }
  .cost-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cost-tier {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .cost-tier.ejecutivo { color: var(--series-1); }
  .cost-tier.junior { color: var(--text-muted); }
  .cost-detail {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    gap: 2px;
    white-space: nowrap;
  }
  .cost-value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    min-width: 110px;
    text-align: right;
  }
  .cost-row.best .cost-value { color: var(--good); }

  /* ---- Boton de pauta activa/desactivada ---- */
  .pauta-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .pauta-info { font-size: 12px; color: var(--text-muted); }
  .pauta-toggle-btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    color: #fff;
    background: var(--danger);
  }
  .pauta-toggle-btn.off { background: var(--good); color: #0a0908; }
  .pauta-toggle-btn:disabled { opacity: 0.6; cursor: default; }

  /* ---- Estado critico ---- */
  .critico-title {
    font-size: 16px;
    font-weight: 700;
    margin: 4px 0 12px;
    color: var(--text-primary);
  }
  .critico-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .critical-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--gridline);
    font-size: 13px;
  }
  .critical-row:last-child { border-bottom: none; }
  .critical-row .agente-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .critical-row .critical-value {
    color: var(--danger);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .critico-total {
    border-color: rgba(229,72,77,0.4);
    background: linear-gradient(160deg, rgba(229,72,77,0.1), var(--surface-1));
  }
  .critico-total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .critico-total-row:last-child { border-bottom: none; }
  .critico-total-row .agente-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .critico-total-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .critico-total-stats span {
    font-size: 12px;
    font-weight: 700;
    color: var(--danger);
    background: rgba(229,72,77,0.14);
    border: 1px solid rgba(229,72,77,0.35);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---- Table ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  tr:last-child td { border-bottom: none; }

  /* ---- States ---- */
  .state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
  }
  .state .big { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
  .state .small { font-size: 13px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ---- Login ---- */
  body.login-screen {
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 15%, rgba(220,174,83,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(220,174,83,0.10), transparent 50%),
      repeating-linear-gradient(0deg, rgba(220,174,83,0.05) 0px, rgba(220,174,83,0.05) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(220,174,83,0.05) 0px, rgba(220,174,83,0.05) 1px, transparent 1px, transparent 48px),
      linear-gradient(160deg, #100e08 0%, #0a0908 55%, #050504 100%);
    background-attachment: fixed;
  }
  .login {
    max-width: 380px;
    margin: 80px auto;
    position: relative;
    background: linear-gradient(160deg, rgba(23,21,16,0.86), rgba(10,9,8,0.92));
    backdrop-filter: blur(6px);
    border: 1px solid rgba(220,174,83,0.28);
    box-shadow: 0 0 0 1px rgba(220,174,83,0.06), 0 24px 60px -20px rgba(0,0,0,0.7), 0 0 40px -12px rgba(220,174,83,0.25);
  }
  .login h2 { font-size: 17px; margin: 0 0 6px; }
  .login p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 4px; }
  .login input {
    width: 100%;
    font: inherit;
    font-size: 13px;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function opcionesMesesGlobal() {
    var hoy = new Date();
    var opciones = [];
    for (var i = 0; i < 6; i++) {
      var d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      var value = i === 0 ? "" : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");

  function fmtDate(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // Convierte una fecha "YYYY-MM-DD" (dia calendario en la zona horaria
  // local del navegador) al instante UTC exacto de su inicio/fin, para
  // mandarle al backend un limite preciso en vez de una fecha ambigua - si
  // no, un filtro de "hoy" en Colombia (UTC-5) puede dejar afuera actividad
  // de la noche que en UTC ya cayo en el dia siguiente.
  function localDayStartIso(fechaStr) {
    var p = fechaStr.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 0, 0, 0, 0).toISOString();
  }
  function localDayEndIso(fechaStr) {
    var p = fechaStr.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 23, 59, 59, 999).toISOString();
  }

    {
      id: "mes",
      label: "Este mes",
      range: function () {
        var hoy = new Date();
        var inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        return { desde: fmtDate(inicio), hasta: fmtDate(hoy) };
      },
    },
  ];

  function pct(n) {
    return (Math.round(n * 10) / 10).toString().replace(".0", "") + "%";

  function renderData(data) {
    if (esRolDirector(data.rol)) { ensureAdminButton(); ensureAjusteButton(); }
    var meta = Number(data.metaVentasUSD) || 2400;
    var agentes = (data.agentes || []).slice().sort(function (a, b) { return b.ventasUSD - a.ventasUSD; });

    var totals = agentes.reduce(function (acc, a) {
      acc.leads += a.leads || 0;
      acc.registros += a.registros || 0;
      acc.ftds += a.ftds || 0;
      acc.ventasUSD += a.ventasUSD || 0;
      return acc;
    }, { leads: 0, registros: 0, ftds: 0, ventasUSD: 0 });

    var content = el("div");

    var tilesArr = [
      statTile("Leads", totals.leads.toLocaleString("en-US"), null),

      statTile("FTDs", totals.ftds.toLocaleString("en-US"), totals.leads ? pct(totals.ftds / totals.leads * 100) + " de los leads" : null),

  var abonosPanelOpen = false;

  function wireAbonosPanel(data, abonosMontoUSD, abonosCantidad) {
    var btn = document.getElementById("abonos-btn");
    var panel = document.getElementById("abonos-panel");
    if (!btn || !panel) return;

    function renderPanel() {
      panel.innerHTML = "";
      panel.appendChild(el("div", { class: "section-title", text: "Editar abonos" }));
      panel.appendChild(el("div", {
        class: "section-desc",
        text: "No es sumar ni restar: el valor que pongas acá reemplaza el total actual de abonos.",
      }));
      panel.appendChild(el("div", { class: "valor-actual" }, [
        el("span", { text: "Valor actual: " }),
        el("b", { text: currency.format(abonosMontoUSD) }),
        el("span", { text: " · " }),
        el("b", { text: String(abonosCantidad) }),
        el("span", { text: abonosCantidad === 1 ? " abono" : " abonos" }),
      ]));

      var montoInput = el("input", { type: "number", class: "range-input", value: String(abonosMontoUSD), min: "0", step: "0.01" });
      var cantidadInput = el("input", { type: "number", class: "range-input", value: String(abonosCantidad), min: "0" });
      var msg = el("span", { class: "admin-msg" });
      var guardarBtn = el("button", { class: "btn", text: "Guardar valor" });

      guardarBtn.addEventListener("click", function () {
        var montoUSD = Number(montoInput.value);
        var cantidad = Math.trunc(Number(cantidadInput.value));
        if (!Number.isFinite(montoUSD) || montoUSD < 0) {
          msg.textContent = "El monto debe ser un número mayor o igual a 0";
          return;
        }
        if (!Number.isFinite(cantidad) || cantidad < 0) {
          msg.textContent = "La cantidad debe ser un número mayor o igual a 0";
          return;
        }
        guardarBtn.disabled = true;
        guardarBtn.textContent = "Guardando…";
        fetch(adminUrl("abonos"), {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + currentAccessToken },
          body: JSON.stringify({ montoUSD: montoUSD, cantidad: cantidad }),
        })
          .then(function (res) {
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (r) {
            guardarBtn.disabled = false;
            guardarBtn.textContent = "Guardar valor";
            if (r.status !== 200) {
              msg.textContent = r.body.error || "No se pudo guardar";
              return;
            }
            msg.textContent = "Listo: abonos actualizados.";
            loadMetrics(true, currentAccessToken);
          })
          .catch(function () {
            guardarBtn.disabled = false;
            guardarBtn.textContent = "Guardar valor";
            msg.textContent = "Error de red, probá de nuevo.";
          });
      });

      panel.appendChild(el("div", { class: "admin-row" }, [montoInput, cantidadInput, guardarBtn, msg]));
    }

    renderPanel();

    btn.addEventListener("click", function () {
      abonosPanelOpen = !abonosPanelOpen;
      panel.classList.toggle("hidden", !abonosPanelOpen);
    });
    panel.classList.toggle("hidden", !abonosPanelOpen);
  }

  function cargarVentasDetalle() {
    if (!ventasDetalleDesde || !ventasDetalleHasta) {
      var hoyStr = fmtDate(new Date());
      ventasDetalleDesde = hoyStr;
      ventasDetalleHasta = hoyStr;
    }
    var qs = "?desde=" + encodeURIComponent(localDayStartIso(ventasDetalleDesde)) + "&hasta=" + encodeURIComponent(localDayEndIso(ventasDetalleHasta));
    if (ventasDetalleAgente) qs += "&agente=" + encodeURIComponent(ventasDetalleAgente);
    if (currentEmpresaOverride) qs += "&empresa=" + encodeURIComponent(currentEmpresaOverride);

    fetch("/ventas-detalle" + qs, { headers: { Authorization: "Bearer " + currentAccessToken } })
      .then(function (res) {
        if (!res.ok) throw new Error("No se pudo cargar el detalle de ventas (código " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        renderVentasDetalleSection(data);
      })
      .catch(function (err) {
        var c = document.getElementById("ventas-detalle-container");
        if (!c) return;
        c.innerHTML = "";
        c.appendChild(el("div", { class: "card state" }, [
          el("div", { class: "big", text: "No se pudo cargar el detalle de ventas" }),
          el("div", { class: "small", text: err.message || "" }),
        ]));
      });
  }

  function renderVentasDetalleSection(data) {
    var container = document.getElementById("ventas-detalle-container");
    if (!container) return;
    container.innerHTML = "";

    if (esRolDirector(currentRol)) {
      var agentesSel = data.agentesActivos || [];
      var select = el("select", { class: "agente-select" }, [el("option", { value: "", text: "Todos los agentes" })]);
      agentesSel.forEach(function (a) {
        select.appendChild(el("option", { value: a, text: a }));
      });
      select.value = ventasDetalleAgente;
      select.addEventListener("change", function () {
        ventasDetalleAgente = select.value;
        cargarVentasDetalle();
      });
      container.appendChild(el("div", { class: "agente-filter-row" }, [
        el("span", { class: "range-label", text: "Agente:" }),
        select,
      ]));

  // Compara una fecha contra un dia calendario puntual en la zona horaria
  // local del navegador (offset=0 hoy, 1 ayer, etc - no acumulado).
  function esDiaObjetivo(fechaIso, offset) {
    var objetivo = new Date();
    objetivo.setDate(objetivo.getDate() - offset);
    var f = new Date(fechaIso);
    return f.getFullYear() === objetivo.getFullYear() && f.getMonth() === objetivo.getMonth() && f.getDate() === objetivo.getDate();
  }

  // Filtra los eventos recientes del agente segun el preset elegido: "dia"
  // compara contra un dia calendario puntual, "horas" es una ventana movil
  // desde ahora (ej. ultimas 8h), "rango" es un rango de fechas que el
  // director elige libremente.
  function eventosEnVentana(eventos, preset) {
    if (preset.tipo === "horas") {
      var limite = Date.now() - preset.horas * 60 * 60 * 1000;
      return (eventos || []).filter(function (e) { return new Date(e.fecha).getTime() >= limite; });
    }
    if (preset.tipo === "rango") {
      var inicio = new Date(preset.desde + "T00:00:00");
      var fin = new Date(preset.hasta + "T23:59:59.999");
      return (eventos || []).filter(function (e) {
        var t = new Date(e.fecha).getTime();
        return t >= inicio.getTime() && t <= fin.getTime();
      });
    }
    return (eventos || []).filter(function (e) { return esDiaObjetivo(e.fecha, preset.offset); });
  }

    var ftds = data.ftds || [];

    if (usuariosAgente) {
      registros = registros.filter(function (f) { return f.agente === usuariosAgente; });
      ftds = ftds.filter(function (f) { return f.agente === usuariosAgente; });
    }

    var content = el("div");

    if (esRolDirector(currentRol)) {
      var agentes = data.agentesActivos || [];
      var select = el("select", { class: "agente-select" }, [el("option", { value: "", text: "Todos los agentes" })]);
      agentes.forEach(function (a) {
        select.appendChild(el("option", { value: a, text: a }));
      });
      select.value = usuariosAgente;
      select.addEventListener("change", function () {
        usuariosAgente = select.value;
        renderUsuariosView(lastUsuariosData);
      });
      content.appendChild(el("div", { class: "agente-filter-row" }, [
        el("span", { class: "range-label", text: "Agente:" }),
        select,
      ]));
    }

    var desdeInput = el("input", { type: "date", class: "range-input", value: usuariosDesde || "" });
    var hastaInput = el("input", { type: "date", class: "range-input", value: usuariosHasta || "" });
    var aplicarBtn = el("button", { class: "btn", text: "Aplicar" });
    aplicarBtn.addEventListener("click", function () {
      if (!desdeInput.value || !hastaInput.value) return;
      usuariosDesde = desdeInput.value;
      usuariosHasta = hastaInput.value > desdeInput.value ? hastaInput.value : desdeInput.value;
      loadMetrics(true, currentAccessToken);
    });
    content.appendChild(el("div", { class: "range-row active" }, [
      el("span", { class: "range-label", text: "Rango de fechas:" }),
      desdeInput,
      el("span", { text: "→" }),
      hastaInput,
      aplicarBtn,
    ]));

    var rangoTexto = usuariosDesde === usuariosHasta ? "el " + usuariosDesde : "entre " + usuariosDesde + " y " + usuariosHasta;
    content.appendChild(el("section", {}, [buildUserTable("Registros (" + rangoTexto + ")", registros)]));
    content.appendChild(el("section", {}, [buildUserTable("FTD (" + rangoTexto + ")", ftds)]));
    renderContentState(content);
    document.getElementById("updated-label").textContent =
      "Actualizado " + new Date(data.actualizado || Date.now()).toLocaleTimeString("es-419", { hour: "2-digit", minute: "2-digit" });
  }

  function loadMetrics(manual, accessToken) {
    currentAccessToken = accessToken;
    var refreshBtn = document.getElementById("refresh-btn");
    if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = "Actualizando…"; }
    if (manual) renderLoading();

    var endpoint = "/metrics";
    if (currentView === "usuarios") endpoint = "/usuarios";
    else if (currentView === "pago-director") endpoint = "/pago-director";
    else if (currentView === "mi-ganancia") endpoint = "/mi-ganancia";

    var qs = "";
    if (currentView === "dashboard" && currentDesde && currentHasta) {
      qs = "?desde=" + encodeURIComponent(localDayStartIso(currentDesde)) + "&hasta=" + encodeURIComponent(localDayEndIso(currentHasta));
    } else if (currentView === "usuarios" && usuariosDesde && usuariosHasta) {
      qs = "?desde=" + encodeURIComponent(localDayStartIso(usuariosDesde)) + "&hasta=" + encodeURIComponent(localDayEndIso(usuariosHasta));
    } else if (currentView === "ranking" || currentView === "pago-director" || currentView === "mi-ganancia") {
      var hoyStr = fmtDate(new Date());
      var inicioMesStr = fmtDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
      qs = "?desde=" + encodeURIComponent(localDayStartIso(inicioMesStr)) + "&hasta=" + encodeURIComponent(localDayEndIso(hoyStr));
    }
    // El superadmin viendo una oficina puntual manda que empresa mirar -
    // para todos los demas roles esto no aplica (currentEmpresaOverride
    // nunca se fija) y no cambia nada de lo de siempre.
    if (currentEmpresaOverride) {
      qs += (qs ? "&" : "?") + "empresa=" + encodeURIComponent(currentEmpresaOverride);
    }

    fetch(endpoint + qs, { headers: { Authorization: "Bearer " + accessToken } })
      .then(function (res) {
        if (res.status === 401) throw new Error("Tu sesión venció, volvé a iniciar sesión.");
        if (res.status === 403) throw new Error("Tu cuenta todavía no tiene acceso configurado. Pedile al director que te habilite.");
        if (!res.ok) throw new Error("El servidor respondió con un error (código " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        currentRol = data.rol;
        if (data.empresaNombre !== undefined) currentEmpresaNombre = data.empresaNombre || "";
        if (currentView === "ranking") renderRankingView(data);
        else if (currentView === "inactividad") renderInactividadView(data);
        else if (currentView === "usuarios") renderUsuariosView(data);
        else if (currentView === "ventas-equipo") renderVentasEquipoView(data);
        else if (currentView === "pago-director") renderPagoDirectorView(data);
        else if (currentView === "mi-ganancia") renderMiGananciaView(data);
        else renderData(data);
      })
      .catch(function (err) {
        renderError(err.message || "No se pudo obtener los datos.");
      })
      .finally(function () {
        if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = "Actualizar"; }
      });
  }

  function boot() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    adminPanelOpen = false;
    ajustePanelOpen = false;
    currentView = "welcome";
    supabaseClient.auth.getSession().then(function (result) {
      var session = result.data && result.data.session;
      if (!session) {
        renderLogin();
        return;
      }
      currentEmail = session.user && session.user.email;
      currentAccessToken = session.access_token;
      fetch("/metrics", { headers: { Authorization: "Bearer " + session.access_token } })
        .then(function (res) {
          // 400 antes de cualquier otro chequeo solo puede ser el "elegi una
          // empresa" que devuelve requireAuth para superadmin (el unico otro
          // 400 de este endpoint es de validacion de fechas, y esa nunca pasa
          // sin auth exitosa primero) - se resuelve con el selector de
          // oficinas en vez de tratarlo como error.
          if (res.status === 400) {
            return loadSuperadminPicker();
          }
          if (res.status === 401) throw new Error("Tu sesión venció, volvé a iniciar sesión.");
          if (res.status === 403) throw new Error("Tu cuenta todavía no tiene acceso configurado. Pedile al director que te habilite.");
          if (!res.ok) throw new Error("El servidor respondió con un error (código " + res.status + ")");
          return res.json().then(function (data) {
            currentRol = data.rol;
            currentEmpresaNombre = data.empresaNombre || "";
            renderWelcome();
          });
        })
        .catch(function (err) {
          renderLogin(err.message || "No se pudo cargar tu cuenta.");
        });
      refreshTimer = setInterval(function () {
        supabaseClient.auth.getSession().then(function (r) {
          var s = r.data && r.data.session;
          if (s && currentView === "global") enterGlobalView();
          else if (s && currentView !== "welcome") loadMetrics(false, s.access_token);
        });
      }, REFRESH_MS);
    });
  }

  boot();
})();
</script>
</body>
</html>
