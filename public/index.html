<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conversión de Ventas — Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1: #171510;
    --page: #0a0908;
    --text-primary: #f6f1e6;
    --text-secondary: #beb49b;
    --text-muted: #837a63;
    --gridline: #2a271e;
    --baseline: #3a3527;
    --border: rgba(224,187,102,0.16);
    --series-1: #dcae53;
    --series-1-soft: #3d3115;
    --good: #4caf6d;
    --warning: #e0a83c;
    --danger: #e5484d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .brand-mark {
    width: 9px;
    height: 9px;
    flex: none;
    background: var(--series-1);
    transform: rotate(45deg);
    border-radius: 2px;
  }
  .brand-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .brand-name b {
    color: var(--series-1);
    font-weight: 700;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .updated {
    font-size: 12px;
    color: var(--text-muted);
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  .btn {
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--series-1); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  /* ---- Stat tiles ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tile .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .tile .value {
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
  }
  .tile .caption {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ---- Chart section ---- */
  section { margin-bottom: 24px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }
  .bar-row .agente-name {
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    position: relative;
    height: 22px;
    background: var(--gridline);
    border-radius: 4px;
    overflow: visible;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--series-1);
    border-radius: 4px;
    min-width: 4px;
    transition: width 0.4s ease;
  }
  .goal-line {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--text-primary);
    opacity: 0.45;
  }
  .goal-line::after {
    content: "meta";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .bar-row .amount {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    min-width: 78px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  .goal-badge {
    color: var(--good);
    font-size: 13px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--series-1); }
  .swatch.line { width: 2px; height: 12px; border-radius: 0; background: var(--text-primary); opacity: 0.45; }

  /* ---- FTD ranking ---- */
  .rank-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rank-row.top .rank-num {
    background: var(--series-1);
    border-color: var(--series-1);
    color: #14110a;
  }
  .rank-row .agente-name { font-size: 13px; }
  .rank-row .rank-ftd {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .rank-row .rank-ftd small {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 4px;
  }

  /* ---- Ventas del equipo ---- */
  .team-sales-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }
  .team-sales-card {
    background: linear-gradient(160deg, var(--surface-1), var(--page));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .team-sales-card:hover {
    border-color: var(--series-1);
    transform: translateY(-2px);
  }
  .tsc-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--page);
    background: linear-gradient(135deg, var(--series-1), #f4d78a);
    margin-bottom: 12px;
  }
  .tsc-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 14px;
  }
  .tsc-stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 7px 0;
    border-top: 1px solid var(--gridline);
  }
  .tsc-stat:first-of-type { border-top: none; }
  .tsc-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tsc-value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .tsc-value.gold { color: var(--series-1); }

  /* ---- Pago de directores ---- */
  .director-hero {
    text-align: center;
    padding: 36px 28px;
    background: radial-gradient(circle at 50% 0%, var(--series-1-soft), var(--surface-1) 70%);
  }
  .dh-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .dh-total {
    font-size: 44px;
    font-weight: 800;
    color: var(--series-1);
    font-variant-numeric: tabular-nums;
    margin-bottom: 24px;
  }
  .dh-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 20px 0;
    border-top: 1px solid var(--gridline);
    border-bottom: 1px solid var(--gridline);
    margin-bottom: 24px;
  }
  .dh-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dh-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .dh-stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .dh-progress-wrap { max-width: 480px; margin: 0 auto; text-align: left; }
  .dh-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .dh-progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2, var(--gridline));
    overflow: hidden;
  }
  .dh-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--series-1);
    transition: width 0.3s;
  }
  .dh-progress-fill.full { background: var(--good); }
  .dh-progress-caption {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .spotlight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .spotlight-card {
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .spotlight-card.star {
    background: linear-gradient(160deg, var(--series-1-soft), var(--surface-1));
  }
  .spotlight-card.warning {
    background: linear-gradient(160deg, rgba(229,72,77,0.16), var(--surface-1));
    border-color: rgba(229,72,77,0.35);
  }
  .spotlight-kicker {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .spotlight-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spotlight-value {
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .spotlight-card.warning .spotlight-value { color: var(--danger); }

  /* ---- Table ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  tr:last-child td { border-bottom: none; }

  /* ---- States ---- */
  .state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
  }
  .state .big { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
  .state .small { font-size: 13px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ---- Login ---- */
  .login {
    max-width: 380px;
    margin: 80px auto;
  }
  .login h2 { font-size: 17px; margin: 0 0 6px; }
  .login p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 4px; }
  .login input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    margin-top: 10px;
  }
  .login input:focus,
  .admin-row input:focus {
    outline: none;
    border-color: var(--series-1);
    box-shadow: 0 0 0 3px var(--series-1-soft);
  }
  .login .error {
    color: #d03b3b;
    font-size: 12px;
    min-height: 16px;
    margin-top: 8px;
  }
  .login .btn { width: 100%; justify-content: center; margin-top: 4px; }
  .whoami { font-size: 12px; color: var(--text-muted); }

  /* ---- Admin panel ---- */
  .admin-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gridline);
    flex-wrap: wrap;
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-name { font-size: 13px; min-width: 160px; }
  .admin-row input {
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    min-width: 200px;
    flex: 1;
  }
  .admin-badge-ok { font-size: 12px; color: var(--good); margin-left: auto; }
  .admin-email { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .admin-msg { font-size: 12px; color: var(--text-secondary); }
  .admin-row input.admin-num-input { min-width: 70px; max-width: 90px; flex: none; margin-left: auto; }
  .admin-section-gap { margin-top: 18px; }

  /* ---- Date filter ---- */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-pill {
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
  }
  .filter-pill:hover { border-color: var(--series-1); }
  .filter-pill.active {
    background: var(--series-1);
    border-color: var(--series-1);
    color: #14110a;
    font-weight: 600;
  }

  /* ---- Rango personalizado ---- */
  .range-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-1);
  }
  .range-row.active { border-color: var(--series-1); }
  .range-label { font-size: 12px; color: var(--text-secondary); }
  .range-row span { color: var(--text-muted); font-size: 12px; }
  .range-input {
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }

  /* ---- Filtro de agente (panel de usuarios) ---- */
  .agente-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-1);
  }
  .agente-select {
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }

  /* ---- Welcome screen ---- */
  .welcome-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .welcome-hero {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: radial-gradient(circle at 30% 30%, var(--series-1-soft), var(--page) 70%);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .welcome-hero .brand-mark { width: 20px; height: 20px; }
  .welcome-kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--series-1);
    margin-bottom: 10px;
  }
  .welcome-title {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .welcome-sub {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 420px;
    margin: 0 0 36px;
    line-height: 1.5;
  }
  .welcome-nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 720px;
  }
  .nav-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px;
    text-align: left;
    color: var(--text-primary);
    font: inherit;
    cursor: pointer;
  }
  .nav-card:hover { border-color: var(--series-1); }
  .nav-card .nav-icon {
    width: 8px;
    height: 8px;
    background: var(--series-1);
    transform: rotate(45deg);
    border-radius: 2px;
    margin-bottom: 14px;
  }
  .nav-card .nav-label { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .nav-card .nav-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .welcome-btn {
    background: var(--series-1);
    border: 1px solid var(--series-1);
    color: #14110a;
    font-weight: 600;
    border-radius: 10px;
    padding: 14px 32px;
    font-size: 14px;
  }
  .welcome-logout {
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-muted);
    background: none;
    border: none;
    text-decoration: underline;
  }

  /* ---- Inactividad ---- */
  .inact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .inact-row:last-child { border-bottom: none; }
  .inact-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex: none;
  }
  .inact-row.ftd .inact-dot { background: var(--good); }
  .inact-row.registro .inact-dot { background: var(--warning); }
  .inact-row.ninguno .inact-dot { background: var(--danger); }
  .inact-row .agente-name { flex: 1; font-size: 13px; }
  .inact-row .inact-status { font-size: 12px; color: var(--text-muted); text-align: right; font-weight: 600; }
  .inact-row.ftd .inact-status { color: var(--good); }
  .inact-row.registro .inact-status { color: var(--warning); }
  .inact-row.ninguno .inact-status { color: var(--danger); }

  /* ---- Usuarios (registro / FTD) ---- */
  .user-table-wrap { overflow-x: auto; }
  .user-table { width: 100%; min-width: 640px; }
  .user-row {
    display: grid;
    grid-template-columns: 1.5fr 1.1fr 1.4fr 1.1fr 0.9fr;
    gap: 12px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--gridline);
    font-size: 13px;
  }
  .user-row:last-child { border-bottom: none; }
  .user-row.header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--gridline);
  }
  .user-row .user-id { font-family: monospace; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-row .user-telefono { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .user-row .user-nombre { font-weight: 600; }
  .user-row .user-nombre.sin-nombre { color: var(--text-muted); font-weight: 400; font-style: italic; }
  .user-row .user-fecha { font-size: 12px; color: var(--text-muted); text-align: right; }
</style>
</head>

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function fmtDate(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // Convierte una fecha "YYYY-MM-DD" (dia calendario en la zona horaria
  // local del navegador) al instante UTC exacto de su inicio/fin, para
  // mandarle al backend un limite preciso en vez de una fecha ambigua - si
  // no, un filtro de "hoy" en Colombia (UTC-5) puede dejar afuera actividad
  // de la noche que en UTC ya cayo en el dia siguiente.
  function localDayStartIso(fechaStr) {
    var p = fechaStr.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 0, 0, 0, 0).toISOString();
  }
  function localDayEndIso(fechaStr) {
    var p = fechaStr.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 23, 59, 59, 999).toISOString();
  }

      },
    },
  ];

  function renderAdminList(agentes) {
    var panel = document.getElementById("admin-panel");
    if (!panel) return;
    panel.innerHTML = "";
    panel.appendChild(el("div", { class: "section-title", text: "Agentes y accesos" }));
    panel.appendChild(el("div", { class: "section-desc", text: agentes.length + " agentes en tu equipo. Cada uno ve solo sus propios datos al iniciar sesión." }));

    agentes.forEach(function (a) {

        panel.appendChild(el("div", { class: "admin-row" }, [
          el("span", { class: "admin-name", text: a.nombre }),
          el("span", { class: "admin-email", text: a.email }),

        ]));
        return;
      }
      var emailInput = el("input", { type: "email", value: KNOWN_EMAILS[a.nombre] || "" });
      var msg = el("span", { class: "admin-msg" });
      var btn = el("button", { class: "btn", text: "Crear acceso" });
      btn.addEventListener("click", function () {
        var email = emailInput.value.trim();
        if (!email) {
          msg.textContent = "Falta el email";
          return;
        }
        btn.disabled = true;
        btn.textContent = "Creando…";
        fetch("/api/admin/crear-login-agente", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + currentAccessToken },
          body: JSON.stringify({ agenteId: a.id, email: email }),
        })
          .then(function (res) {
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (r) {
            if (r.status !== 201) {
              msg.textContent = r.body.error || "No se pudo crear";
              btn.disabled = false;
              btn.textContent = "Crear acceso";
              return;
            }
            msg.textContent = "Contraseña: " + r.body.password + " — copiala y compartísela, no se vuelve a mostrar.";
            btn.remove();
            emailInput.disabled = true;
          })
          .catch(function () {
            msg.textContent = "Error de red, probá de nuevo.";
            btn.disabled = false;
            btn.textContent = "Crear acceso";
          });
      });
      panel.appendChild(el("div", { class: "admin-row" }, [
        el("span", { class: "admin-name", text: a.nombre }),
        emailInput,
        btn,
        msg,
      ]));
    });
  }

  function renderData(data) {

    var meta = Number(data.metaVentasUSD) || 2400;
    var agentes = (data.agentes || []).slice().sort(function (a, b) { return b.ventasUSD - a.ventasUSD; });

    var totals = agentes.reduce(function (acc, a) {
      acc.leads += a.leads || 0;
      acc.registros += a.registros || 0;
      acc.ftds += a.ftds || 0;
      acc.ventasUSD += a.ventasUSD || 0;
      return acc;
    }, { leads: 0, registros: 0, ftds: 0, ventasUSD: 0 });

    var content = el("div");

    var tiles = el("div", { class: "tiles" }, [
      statTile("Leads", totals.leads.toLocaleString("en-US"), null),
      statTile("Registrados en EXOPTION", totals.registros.toLocaleString("en-US"), totals.leads ? pct(totals.registros / totals.leads * 100) + " de los leads" : null),
      statTile("FTDs", totals.ftds.toLocaleString("en-US"), totals.leads ? pct(totals.ftds / totals.leads * 100) + " de los leads" : null),

    content.appendChild(el("section", {}, [buildRankingCard(data)]));

    table.appendChild(el("thead", {}, [
      el("tr", {}, [

  function buildRankingCard(data) {
    var esDirector = data.rol === "director";
    var porFtd = (data.agentes || []).slice().sort(function (a, b) { return (b.ftds || 0) - (a.ftds || 0); });

    rankCard.appendChild(el("div", { class: "section-title", text: "Ranking de FTD" }));

      text: esDirector
        ? "De mejor a peor por FTD convertido. Se reordena solo cuando cambian los números."

    }));
    if (porFtd.length === 0) {
      rankCard.appendChild(el("div", { class: "section-desc", text: "Todavía no hay FTD registrados." }));
    }
    porFtd.forEach(function (a, i) {
      rankCard.appendChild(el("div", { class: "rank-row" + (i === 0 && esDirector ? " top" : "") }, [
        el("div", { class: "rank-num", text: esDirector ? String(i + 1) : "?" }),
        el("div", { class: "agente-name", text: a.agente, title: a.agente }),
        el("div", { class: "rank-ftd" }, [
          document.createTextNode(String(a.ftds || 0)),
          el("small", { text: "FTD" }),
        ]),
      ]));
    });
    return rankCard;
  }

  function buildPagosRankingCard(data) {
    var esDirector = data.rol === "director";
    var porPago = (data.agentes || []).slice().sort(function (a, b) { return (b.gananciaEstimadaUSD || 0) - (a.gananciaEstimadaUSD || 0); });
    var rankCard = el("div", { class: "card" });
    rankCard.appendChild(el("div", { class: "section-title", text: "Ranking mejores pagos" }));

      text: esDirector
        ? "Estimado del mes: comisión de ventas ya ganada + bono por FTD convertido."

  // Compara una fecha contra un dia calendario puntual en la zona horaria
  // local del navegador (offset=0 hoy, 1 ayer, etc - no acumulado).
  function esDiaObjetivo(fechaIso, offset) {
    var objetivo = new Date();
    objetivo.setDate(objetivo.getDate() - offset);
    var f = new Date(fechaIso);
    return f.getFullYear() === objetivo.getFullYear() && f.getMonth() === objetivo.getMonth() && f.getDate() === objetivo.getDate();
  }

  // Filtra los eventos recientes del agente segun el preset elegido: "dia"
  // compara contra un dia calendario puntual, "horas" es una ventana movil
  // desde ahora (ej. ultimas 8h), "rango" es un rango de fechas que el
  // director elige libremente.
  function eventosEnVentana(eventos, preset) {
    if (preset.tipo === "horas") {
      var limite = Date.now() - preset.horas * 60 * 60 * 1000;
      return (eventos || []).filter(function (e) { return new Date(e.fecha).getTime() >= limite; });
    }
    if (preset.tipo === "rango") {
      var inicio = new Date(preset.desde + "T00:00:00");
      var fin = new Date(preset.hasta + "T23:59:59.999");
      return (eventos || []).filter(function (e) {
        var t = new Date(e.fecha).getTime();
        return t >= inicio.getTime() && t <= fin.getTime();
      });
    }
    return (eventos || []).filter(function (e) { return esDiaObjetivo(e.fecha, preset.offset); });
  }

  var ESTADO_ORDEN = { ninguno: 0, registro: 1, ftd: 2 };
  var ESTADO_TEXTO = { ftd: "Hizo FTD", registro: "Solo hizo registro", ninguno: "Sin actividad de registros ni FTD" };

  function renderInactividadView(data) {
    var preset;
    if (currentInactPreset === "custom" && customDesde && customHasta) {
      preset = {
        id: "custom",
        tipo: "rango",
        desde: customDesde,
        hasta: customHasta,
        ventana: customDesde === customHasta ? "el " + customDesde : "entre " + customDesde + " y " + customHasta,
      };
    } else {
      preset = INACT_PRESETS.filter(function (p) { return p.id === currentInactPreset; })[0] || INACT_PRESETS[0];
    }
    var agentes = (data.agentes || []).slice();

    var withStatus = agentes.map(function (a) {
      var eventos = eventosEnVentana(a.conversionesRecientes || [], preset);
      var numFtd = eventos.filter(function (e) { return e.tipo === "ftd"; }).length;
      var numRegistro = eventos.filter(function (e) { return e.tipo === "registro"; }).length;
      var estado = numFtd > 0 ? "ftd" : (numRegistro > 0 ? "registro" : "ninguno");
      var todasFechas = (a.conversionesRecientes || []).map(function (e) { return e.fecha; });
      var masReciente = todasFechas.length ? todasFechas.slice().sort().pop() : "";
      return { agente: a.agente, estado: estado, numFtd: numFtd, numRegistro: numRegistro, fechaOrden: masReciente };
    });
    withStatus.sort(function (a, b) {
      if (ESTADO_ORDEN[a.estado] !== ESTADO_ORDEN[b.estado]) return ESTADO_ORDEN[a.estado] - ESTADO_ORDEN[b.estado];
      return a.fechaOrden.localeCompare(b.fechaOrden);
    });

    var content = el("div");

    var filterRow = el("div", { class: "filter-row" });
    INACT_PRESETS.forEach(function (p) {

      customDesde = desdeInput.value;

      currentInactPreset = "custom";
      renderInactividadView(data);
    });
    var rangeRow = el("div", { class: "range-row" + (currentInactPreset === "custom" ? " active" : "") }, [
      el("span", { class: "range-label", text: "Rango personalizado:" }),

      if (s.numRegistro > 0) detalle.push(s.numRegistro + (s.numRegistro === 1 ? " registro" : " registros"));

  function loadMetrics(manual, accessToken) {
    currentAccessToken = accessToken;
    var refreshBtn = document.getElementById("refresh-btn");
    if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = "Actualizando…"; }
    if (manual) renderLoading();

    var endpoint = "/metrics";
    if (currentView === "usuarios") endpoint = "/usuarios";
    else if (currentView === "pago-director") endpoint = "/pago-director";

    var qs = "";
    if (currentView === "dashboard" && currentDesde && currentHasta) {
      qs = "?desde=" + encodeURIComponent(localDayStartIso(currentDesde)) + "&hasta=" + encodeURIComponent(localDayEndIso(currentHasta));
    } else if (currentView === "usuarios" && usuariosDesde && usuariosHasta) {
      qs = "?desde=" + encodeURIComponent(localDayStartIso(usuariosDesde)) + "&hasta=" + encodeURIComponent(localDayEndIso(usuariosHasta));
    } else if (currentView === "pago-director") {
      var hoyStr = fmtDate(new Date());
      var inicioMesStr = fmtDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
      qs = "?desde=" + encodeURIComponent(localDayStartIso(inicioMesStr)) + "&hasta=" + encodeURIComponent(localDayEndIso(hoyStr));
    }

    fetch(endpoint + qs, { headers: { Authorization: "Bearer " + accessToken } })
      .then(function (res) {
        if (res.status === 401) throw new Error("Tu sesión venció, volvé a iniciar sesión.");
        if (res.status === 403) throw new Error("Tu cuenta todavía no tiene acceso configurado. Pedile al director que te habilite.");
        if (!res.ok) throw new Error("El servidor respondió con un error (código " + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        currentRol = data.rol;
        if (currentView === "ranking") renderRankingView(data);
        else if (currentView === "inactividad") renderInactividadView(data);
        else if (currentView === "usuarios") renderUsuariosView(data);
        else if (currentView === "ventas-equipo") renderVentasEquipoView(data);
        else if (currentView === "pago-director") renderPagoDirectorView(data);
        else renderData(data);
      })
      .catch(function (err) {
        renderError(err.message || "No se pudo obtener los datos.");
      })
      .finally(function () {
        if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = "Actualizar"; }
      });
  }

  function boot() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    adminPanelOpen = false;
    currentView = "welcome";
    supabaseClient.auth.getSession().then(function (result) {
      var session = result.data && result.data.session;
      if (!session) {
        renderLogin();
        return;
      }
      currentEmail = session.user && session.user.email;
      currentAccessToken = session.access_token;
      fetch("/metrics", { headers: { Authorization: "Bearer " + session.access_token } })
        .then(function (res) {
          if (res.status === 401) throw new Error("Tu sesión venció, volvé a iniciar sesión.");
          if (res.status === 403) throw new Error("Tu cuenta todavía no tiene acceso configurado. Pedile al director que te habilite.");
          if (!res.ok) throw new Error("El servidor respondió con un error (código " + res.status + ")");
          return res.json();
        })
        .then(function (data) {
          currentRol = data.rol;
          renderWelcome();
        })
        .catch(function (err) {
          renderLogin(err.message || "No se pudo cargar tu cuenta.");
        });
      refreshTimer = setInterval(function () {
        supabaseClient.auth.getSession().then(function (r) {
          var s = r.data && r.data.session;
          if (s && currentView !== "welcome") loadMetrics(false, s.access_token);
        });
      }, REFRESH_MS);
    });
  }

  boot();
})();
</script>
