name = "dashboardapex-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "dashboardapex"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGIN = "*"
META_VENTAS_USD = "2400"

# WEBHOOK_SECRET NO va aca. Se configura como secreto con:
#   wrangler secret put WEBHOOK_SECRET
